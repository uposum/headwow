name: CI

# Lint and test on every push and pull request. No game and no data needed: the tests run the
# addon's Lua in a mock client with a tiny snapshot (see tests/run.mjs).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (Lua 5.1 syntax, XML, locals used before their definition)
        run: npm run lint

      - name: Test (data logic, and the whole UI in a mock client)
        run: npm test
